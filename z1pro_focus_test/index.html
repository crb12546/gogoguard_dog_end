<h1>Z-1Pro Focus / Zoom Test</h1>
<p>协议里的 <code>focus 0x26</code> 返回失败状态 <code>0x01</code>。手册描述该可见光镜头为定焦相机，所以清晰度问题更可能来自镜头污渍/目标距离/数字变倍/光照/运动，而不是可调焦失败。</p>
<p>已执行 <code>zoom-set --zoom 1.0</code>，该命令返回成功。</p>
