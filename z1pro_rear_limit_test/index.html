<h1>Z-1Pro Rear Limit Test</h1>
<p>用户定义的后向是 front 的 180 度反方向；规格表标注偏航可控范围为 <code>±140°</code>，所以这里测试最大安全近似：<code>+140</code> 和 <code>-140</code>。</p>
<p>注意：大角度切换时云台角速度较高，未来如果把后向设为默认，应使用预设/过渡，不要连续频繁来回打大角度。</p>
